<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>额度联动</title>
  <link rel="stylesheet" href="./app.css">
</head>
<body>
  <main class="page">
    <section class="toolbar panel">
      <div>
        <h1>额度联动</h1>
        <p>监控 OpenAI 周额度重置，并同步清零明确关联的 Client Key 周已用金额。</p>
      </div>
      <div class="toolbar-actions">
        <label class="switch"><input id="dry-run" type="checkbox"><span>Dry Run</span></label>
        <button id="reload" class="secondary">重新加载</button>
        <button id="save">保存映射</button>
      </div>
    </section>

    <div id="notice" class="notice" hidden></div>

    <section class="layout">
      <div class="panel">
        <div class="section-head">
          <div>
            <h2>OpenAI 账号</h2>
            <p>每个分享 Key 只能关联一个监控账号，避免重复补额度。</p>
          </div>
          <button id="refresh-account" class="secondary" disabled>刷新所选额度</button>
        </div>
        <div id="accounts" class="account-list"></div>
      </div>

      <div class="panel">
        <div class="section-head">
          <div>
            <h2>关联 Client Key</h2>
            <p id="selected-account">尚未选择账号</p>
          </div>
        </div>
        <div id="account-alias-editor" class="alias-editor" hidden>
          <label for="account-alias">账号名称（本地别名）</label>
          <input id="account-alias" type="text" maxlength="120" placeholder="例如：主账号 / 活动号 A">
          <p>仅保存在 quota-sync 插件中；宿主 SDK 当前未向插件暴露账号名称。</p>
        </div>
        <div id="window-picker" class="window-picker" hidden></div>
        <div id="keys" class="key-list empty">请选择左侧账号</div>
      </div>
    </section>

    <section class="panel">
      <div class="section-head">
        <div>
          <h2>最近同步事件</h2>
          <p>写入结果未知时不会自动重试；prepared 表示需要人工确认宿主实际状态。</p>
        </div>
        <button id="clear-events" class="secondary">清空事件</button>
      </div>
      <div id="events" class="events empty">暂无事件</div>
    </section>
  </main>
  <script src="./app.js"></script>
</body>
</html>
