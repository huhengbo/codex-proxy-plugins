name: Release Plugins

on:
  push:
    tags:
      - 'bundle-v*'
      - 'bundle-preview-*'
    branches: [main]
    paths:
      - 'release/request.json'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing bundle tag to publish
        required: true
        type: string
      prerelease:
        description: Publish as prerelease
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: plugin-release-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      ref: ${{ steps.release.outputs.ref }}
      target_sha: ${{ steps.release.outputs.target_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: release
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$INPUT_TAG"
            prerelease="$INPUT_PRERELEASE"
            ref="$INPUT_TAG"
            git fetch --force --tags origin
            target_sha="$(git rev-list -n 1 "$INPUT_TAG")"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"
            ref="$GITHUB_REF"
            target_sha="$GITHUB_SHA"
            if [[ "$tag" == bundle-preview-* ]]; then
              prerelease=true
            else
              prerelease=false
            fi
          else
            tag="$(jq -er '.tag' release/request.json)"
            prerelease="$(jq -r '.prerelease // false' release/request.json)"
            ref="$GITHUB_SHA"
            target_sha="$GITHUB_SHA"
          fi

          case "$tag" in
            bundle-v*|bundle-preview-*) ;;
            *) echo "Invalid release tag: $tag" >&2; exit 1 ;;
          esac

          if [[ "$prerelease" != "true" && "$prerelease" != "false" ]]; then
            echo "prerelease must be true or false" >&2
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "target_sha=$target_sha" >> "$GITHUB_OUTPUT"

  check:
    needs: prepare
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.prepare.outputs.ref }}

  build:
    needs: [prepare, check]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      RUST_MIN_STACK: 16777216
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.ref }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@1a3a6d54512beeaffd394f8d516ca16f2c506a20 # 1.97
        with:
          targets: ${{ matrix.target }}
      - name: Validate plugin catalog
        run: python3 scripts/plugin-repo.py validate
      - name: Build every plugin
        run: bash scripts/package-all "${{ matrix.target }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plugins-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: plugins-*
          path: dist
          merge-multiple: true
      - name: Generate release notes
        run: bash scripts/release-notes > dist/RELEASE_NOTES.md
      - name: Publish bundle
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_TARGET: ${{ needs.prepare.outputs.target_sha }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          args=(
            release create "$RELEASE_TAG"
            dist/*.tar.gz dist/*.sha256
            --repo "$GITHUB_REPOSITORY"
            --title "Codex Proxy Plugins $RELEASE_TAG"
            --notes-file dist/RELEASE_NOTES.md
            --latest=false
          )

          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            args+=(--verify-tag)
          else
            args+=(--target "$RELEASE_TARGET")
          fi

          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi
          gh "${args[@]}"
