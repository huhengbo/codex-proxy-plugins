name: Release Plugins

on:
  push:
    tags:
      - 'bundle-v*'
      - 'bundle-preview-*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing bundle tag to publish
        required: true
        type: string
      prerelease:
        description: Publish as prerelease
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: plugin-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.tag || github.ref }}

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      RUST_MIN_STACK: 16777216
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@1a3a6d54512bee8d516ca16f2c506a20 # 1.97
        with:
          targets: ${{ matrix.target }}
      - name: Validate plugin catalog
        run: python3 scripts/plugin-repo.py validate
      - name: Build every plugin
        run: bash scripts/package-all "${{ matrix.target }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plugins-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: plugins-*
          path: dist
          merge-multiple: true
      - name: Generate release notes
        run: bash scripts/release-notes > dist/RELEASE_NOTES.md
      - name: Publish bundle
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          MANUAL_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          prerelease=false
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            prerelease="$MANUAL_PRERELEASE"
          elif [[ "$RELEASE_TAG" == bundle-preview-* ]]; then
            prerelease=true
          fi

          args=(
            release create "$RELEASE_TAG"
            dist/*.tar.gz dist/*.sha256
            --repo "$GITHUB_REPOSITORY"
            --verify-tag
            --title "Codex Proxy Plugins $RELEASE_TAG"
            --notes-file dist/RELEASE_NOTES.md
            --latest=false
          )
          if [[ "$prerelease" == "true" ]]; then
            args+=(--prerelease)
          fi
          gh "${args[@]}"
